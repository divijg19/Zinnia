name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check & Format
        run: bunx biome check --error-on-warnings .

      - name: Lint / typecheck
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Demo build + determinism
        run: |
          bun run demo:build
          find demo/assets -type f | sort | xargs sha256sum > /tmp/demo-assets-a.txt
          bun run demo:build
          find demo/assets -type f | sort | xargs sha256sum > /tmp/demo-assets-b.txt
          diff /tmp/demo-assets-a.txt /tmp/demo-assets-b.txt
          bun tests/demo-assets.smoke.js

      - name: Tests
        env:
          CI: true
        run: bun run test
