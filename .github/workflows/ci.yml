name: CI

env:
  # The Node major every job runs on. The guard step below proves it matches
  # `engines.node` - which is what Vercel deploys with - so the runtime under
  # test is the runtime in production. Bun floats; Node does not, because a
  # Node major is a deployment contract.
  NODE_VERSION: "26"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared setup, repeated per job (each job gets a fresh runner):
# - Bun floats to the current release: the dependency graph is pinned by
#   bun.lock, not by the toolchain, so a Bun upgrade needs no workflow edit.
# - setup-node stays (cheap insurance for tsc/vercel compat) but without
#   check-latest, so day-to-day runs are reproducible.
# - There is deliberately no package cache. Restoring `~/.bun/install/cache`
#   through actions/cache cost over a minute per job and moved ~3.2GB per
#   run, because each job downloads the entry and re-uploads it whenever the
#   lockfile hash changes. A cold `bun install --frozen-lockfile` of the same
#   graph measures 24.9s (an empty node_modules against a warm cache is
#   21ms), and it is faster than the round trip it replaced. setup-bun still
#   caches the bun binary itself, which is the part worth caching.

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Floating: CI tracks the current Bun release, so a toolchain
          # change is picked up without editing a workflow. Reproducibility
          # comes from bun.lock, which pins the dependency graph.
          bun-version: latest

      - name: Check the runtime matches engines.node
        run: |
          node -e '
            const { engines } = require("./package.json");
            const declared = String(engines.node).replace(/[^0-9]/g, "");
            const running = process.versions.node.split(".")[0];
            if (running !== declared) {
              console.error(`node ${running} does not match engines.node ${engines.node}`);
              process.exit(1);
            }
            console.log(`node ${process.version} matches engines.node ${engines.node}`);
          '

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint / typecheck
        run: bun run lint

  build:
    name: Build shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Floating: CI tracks the current Bun release, so a toolchain
          # change is picked up without editing a workflow. Reproducibility
          # comes from bun.lock, which pins the dependency graph.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            streak/dist
            api/_build
            leetcode/packages/core/dist
            stats/api

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Floating: CI tracks the current Bun release, so a toolchain
          # change is picked up without editing a workflow. Reproducibility
          # comes from bun.lock, which pins the dependency graph.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-output

      # NOTE: vitest is invoked directly, not via `bun run test`, because the
      # `pretest` hook would rebuild all 5 bun build shards a second time. The
      # build job already produced them (see the artifact above).
      - name: Tests
        env:
          CI: true
        run: bunx vitest --run

  demo:
    name: Demo build + determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Floating: CI tracks the current Bun release, so a toolchain
          # change is picked up without editing a workflow. Reproducibility
          # comes from bun.lock, which pins the dependency graph.
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Demo build + determinism
        run: |
          bun run demo:build
          find demo/assets -type f | sort | xargs sha256sum > /tmp/demo-assets-a.txt
          bun run demo:build
          find demo/assets -type f | sort | xargs sha256sum > /tmp/demo-assets-b.txt
          diff /tmp/demo-assets-a.txt /tmp/demo-assets-b.txt
          bun tests/demo-assets.smoke.ts
